[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialgate"
version = "0.6.0"
description = "Anti-overfitting validation gate for backtested trading strategies: trial capture from freqtrade and Optuna, tamper-evident trial registry, CSCV/PBO, Deflated Sharpe Ratio, single-use holdout lock, live deviation bands, stop-line survivability, cost stress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tsai Chih-Chun (0Smallcat0)" }]
keywords = [
    "backtesting",
    "overfitting",
    "deflated-sharpe-ratio",
    "probability-of-backtest-overfitting",
    "cscv",
    "audit-trail",
    "tamper-evident",
    "quantitative-finance",
    "validation",
    "holdout",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
trialgate = "trialgate.__main__:main"

[project.urls]
Repository = "https://github.com/0Smallcat0/trialgate"
Issues = "https://github.com/0Smallcat0/trialgate/issues"
"Host system" = "https://github.com/0Smallcat0/crypto-quant-signal"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    # Test-only: independent reference implementations to check against.
    # The library itself stays standard-library only.
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trialgate = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
